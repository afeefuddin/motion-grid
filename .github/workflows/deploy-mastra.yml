name: Deploy Mastra

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mastra-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.MASTRA_ORG_ID != '' && vars.MASTRA_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify required runtime configuration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          test -n "$DATABASE_URL"
          test -n "$ANTHROPIC_API_KEY"

      - name: Apply committed database migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: pnpm exec drizzle-kit migrate

      - name: Deploy production to Mastra
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_GENERATED_MARKET_MODEL: ${{ vars.ANTHROPIC_GENERATED_MARKET_MODEL }}
          MASTRA_API_TOKEN: ${{ secrets.MASTRA_API_TOKEN }}
          MASTRA_ORG_ID: ${{ vars.MASTRA_ORG_ID }}
          MASTRA_PROJECT_ID: ${{ vars.MASTRA_PROJECT_ID }}
        run: |
          umask 077
          env_file="$PWD/.mastra-production.env"
          trap 'rm -f "$env_file"' EXIT
          # Delivery secrets stay with the Next.js deployment; this runtime needs model access.
          {
            printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
            printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY"
            if [ -n "$ANTHROPIC_GENERATED_MARKET_MODEL" ]; then
              printf 'ANTHROPIC_GENERATED_MARKET_MODEL=%s\n' "$ANTHROPIC_GENERATED_MARKET_MODEL"
            fi
          } > "$env_file"
          pnpm run deploy:mastra --yes --env-file "$env_file"
