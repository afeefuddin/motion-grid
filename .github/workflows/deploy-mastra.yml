name: Deploy Mastra

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mastra-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.MASTRA_ORG_ID != '' && vars.MASTRA_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy production to Mastra
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MASTRA_API_TOKEN: ${{ secrets.MASTRA_API_TOKEN }}
          MASTRA_ORG_ID: ${{ vars.MASTRA_ORG_ID }}
          MASTRA_PROJECT_ID: ${{ vars.MASTRA_PROJECT_ID }}
        run: |
          umask 077
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > "$RUNNER_TEMP/mastra-production.env"
          pnpm run deploy:mastra -- --yes --env-file "$RUNNER_TEMP/mastra-production.env"
